services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db_mysql
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=faststoc_db
    depends_on:
      - db_mysql
    restart: on-failure

  db_mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: faststoc_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./setup.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  mysql_data:
